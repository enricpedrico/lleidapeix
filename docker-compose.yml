services:
  app:
    image: lleidapeix:local
    container_name: lleidapeix
    build:
      context: .
    env_file:
      - .env
    environment:
      PORT: 3085
      BIND_ADDRESS: 0.0.0.0
      DATABASE_PATH: /app/data/lleidapeix.sqlite
    ports:
      - "127.0.0.1:18085:3085"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 100
    mem_limit: 384m
    cpus: 1.25
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3085/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

